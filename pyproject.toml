[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amu-admissions-rag"
version = "0.1.0"
description = "Human-validated RAG pipeline for the AMU admissions guide"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pypdf>=6.0",
]

[project.scripts]
amu-extract = "amu_admissions_rag.cli:main"
amu-parse-courses = "amu_admissions_rag.course_cli:main"
amu-parse-policies = "amu_admissions_rag.policy_cli:main"
amu-export-review = "amu_admissions_rag.review_cli:main"


[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
