name: amu-admissions

x-database-url: &database-url
  AMU_RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-amu}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-amu_admissions}

services:
  db:
    image: docker.io/pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-amu_admissions}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback only, for psql and host-side tools; the app reaches db internally.
    ports:
      - "127.0.0.1:${AMU_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: apply migrations, then rebuild and load the approved corpus.
  # It exits quickly when the PDF, code, migrations and review batches are
  # unchanged since the last successful load.
  ingest:
    build: .
    image: amu-admissions-rag:latest
    command: ["amu-pipeline"]
    environment:
      <<: *database-url
    volumes:
      - pipeline-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    # The ingest service builds the shared image once. Declaring a second
    # identical build here can race while exporting the same image tag.
    image: amu-admissions-rag:latest
    restart: unless-stopped
    environment:
      <<: *database-url
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    ports:
      - "127.0.0.1:${AMU_APP_HOST_PORT:-8501}:8501"
    depends_on:
      db:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
  pipeline-data:
